stages:
  - tests-sast

variables:
  PYTHON_IMAGE: python:3.14

default:
  image: $PYTHON_IMAGE

before_script:
  - python --version; pip --version
  - pip install uv
  - uv --version

tests-sast-job:
  stage: tests-sast
  script:
    # nox drives the tooling; each session installs its own deps via uv.
    - uv sync --only-group dev
    # Run selected sessions, not stack test (requires cdk + node.js)
    - uv run nox -s run_lambda_fn_tests format
