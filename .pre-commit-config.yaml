default_language_version:
  python: python3.14

fail_fast: True

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: trailing-whitespace
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: mixed-line-ending


  - repo: local
    hooks:
      - id: nox-test-hook
        name: nox-test-hook
        language: system
        entry: nox
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: cdk-synth
        name: cdk-synth
        language: system
        entry: cdk synth -c account=111122223333 -c region=aa-example-1 --quiet
        always_run: true
        pass_filenames: false
